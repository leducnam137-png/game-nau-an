<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Nấu Lẩu</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff3e0; text-align: center; padding: 15px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        .step { display: none; }
        .active { display: block; }
        h2 { color: #d84315; }
        button { background-color: #ff5722; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #e64a19; }
        .option { text-align: left; margin: 10px 0; font-size: 16px; }
        input[type="range"] { width: 80%; }
    </style>
</head>
<body>

<div class="card">
    <h1>🍲 Mô Phỏng Nấu Ăn</h1>
    <h3 style="color: #8d6e63;">Món đang chọn: Lẩu Thái Hải Sản</h3>
    <hr style="border: 0.5px solid #ffe0b2;">

    <div id="step1" class="step active">
        <h2>Bước 1: Chọn Nguyên Liệu</h2>
        <div class="option"><input type="checkbox" id="ing1" checked> 🥩 Thịt bò tươi</div>
        <div class="option"><input type="checkbox" id="ing2" checked> 🦐 Tôm hùm / Tôm sú</div>
        <div class="option"><input type="checkbox" id="ing3"> 🍄 Nấm kim针 / Nấm đùi gà</div>
        <div class="option"><input type="checkbox" id="ing4"> 🥬 Rau muống, cải cúc</div>
        <button onclick="nextStep(2)">Tiếp theo ➔</button>
    </div>

    <div id="step2" class="step">
        <h2>Bước 2: Thời Gian Ninh</h2>
        <p>Chọn thời gian đun (phút): <b id="timeVal" style="color: #d84315;">15</b> phút</p>
        <input type="range" min="5" max="30" value="15" oninput="document.getElementById('timeVal').innerText = this.value">
        <br>
        <button onclick="nextStep(3)">Tiếp theo ➔</button>
    </div>

    <div id="step3" class="step">
        <h2>Bước 3: Định Lượng Khẩu Phần</h2>
        <p>Số người ăn:</p>
        <select id="portion" style="padding: 8px; font-size: 16px; border-radius: 6px;">
            <option value="1-2">1 - 2 người (Nước lẩu vừa)</option>
            <option value="3-5" selected>3 - 5 người (Đậm đà)</option>
            <option value="6+">Trên 6 người (Nồi lớn đặc biệt)</option>
        </select>
        <br>
        <button onclick="finishCooking()">🔥 Bắt Đầu Nấu</button>
    </div>

    <div id="step4" class="step">
        <h2>🎉 Bước 4: Hoàn Thành!</h2>
        <div style="font-size: 50px;">🍲✨</div>
        <p id="resultText" style="font-size: 16px; color: #2e7d32; font-weight: bold;"></p>
        <button onclick="resetGame()" style="background-color: #4caf50;">🔄 Nấu Nồi Khác</button>
    </div>
</div>

<script>
    function nextStep(stepNum) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + stepNum).classList.add('active');
    }

    function finishCooking() {
        let time = document.getElementById('timeVal').innerText;
        let portion = document.getElementById('portion').value;
        
        let result = `Nồi Lẩu Thái cho ${portion} người đã hoàn thành sau ${time} phút ninh! Nước dùng đậm đà, thơm lừng vị sả ớt! 😋`;
        
        document.getElementById('resultText').innerText = result;
        nextStep(4);
    }

    function resetGame() {
        nextStep(1);
    }
</script>

</body>
</html>
